# yaml-language-server: $schema=https://lefthook.dev/schema.json

pre-commit:
  piped: true # format first, then lint the formatted files
  jobs:
    - name: format
      glob: '*.{js,mjs,ts,tsx,json,md,yml,yaml,css}'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    - name: lint
      glob: '*.{js,mjs,ts,tsx}'
      run: pnpm exec eslint --fix --max-warnings 0 --no-warn-ignored {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: pnpm typecheck
    - name: unit
      run: pnpm test
