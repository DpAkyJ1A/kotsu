name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels its old run; every commit on main gets a run of its own
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# Every job starts with the two steps anchored in `lint`
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm from `packageManager`, Node from `.nvmrc`, then `pnpm install --frozen-lockfile`
      - &setup
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          require-lockfile: true
          cache: true
          # PRs restore the store saved on main instead of each saving its own
          save-cache: ${{ github.event_name == 'push' }}
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup
      - run: pnpm typecheck

  knip:
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup
      - run: pnpm knip

  unit:
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup
      - run: pnpm test

  browser:
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm test:browser

  build:
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup
      - run: pnpm exec playwright install --with-deps --only-shell chromium webkit
      # Builds the app and serves it itself, see `webServer` in playwright.config.ts
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
