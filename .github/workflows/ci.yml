name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels its old run; every commit on main gets a run of its own
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# The Postgres service of the `db` and `e2e` jobs, and a session-signing secret that exists only in CI; `build`
# needs both only to pass the check in src/server/env.ts, and `docker` hands the secret to its container
env:
  DATABASE_URL: postgres://kotsu:kotsu@localhost:5432/kotsu
  BETTER_AUTH_SECRET: ci-only-secret-that-signs-no-real-session

# Every job starts with the two steps anchored in `lint`
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm from `packageManager`, Node from `.nvmrc`, then `pnpm install --frozen-lockfile`
      - &setup
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          require-lockfile: true
          cache: true
          # PRs restore the store saved on main instead of each saving its own
          save-cache: ${{ github.event_name == 'push' }}
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup
      - run: pnpm typecheck

  knip:
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup
      - run: pnpm knip

  unit:
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup
      - run: pnpm test

  db:
    runs-on: ubuntu-latest
    services:
      postgres: &postgres
        image: postgres:18
        env:
          POSTGRES_USER: kotsu
          POSTGRES_PASSWORD: kotsu
          POSTGRES_DB: kotsu
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U kotsu -d kotsu"
          --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - *checkout
      - *setup
      # The command every deployment runs before its build
      - run: pnpm db:migrate
      # On a database of its own, migrated by vitest.db-setup.ts
      - run: pnpm test:db

  browser:
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm test:browser

  build:
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup
      - run: pnpm build

  # Self-hosting as the README describes it: the image builds, migrates a fresh database and passes the smoke tests
  docker:
    runs-on: ubuntu-latest
    env:
      APP_URL: http://localhost:3000
      POSTGRES_PASSWORD: ci-only-database-password
      SIGN_IN_CODES_IN_LOG: 'true'
    steps:
      - *checkout
      - *setup
      - run: docker compose up --build --wait
        working-directory: self-host
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm test:smoke
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
      - if: failure()
        run: docker compose logs
        working-directory: self-host

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres: *postgres
    steps:
      - *checkout
      - *setup
      - run: pnpm exec playwright install --with-deps --only-shell chromium webkit
      # Better Auth counts every request to /api/auth in its `rate_limit` table
      - run: pnpm db:migrate
      # Builds the app and serves it itself, see `webServer` in playwright.config.ts
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
